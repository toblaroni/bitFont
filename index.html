<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitfont Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="settings-container">
            <label for="columns">Columns</label>
            <input type="number" name="columns" id="columns" max="500" min="2" step="1" value="6">
            <label for="rows">Rows</label>
            <input type="number" name="rows" id="rows" max="500" min="2" step="1" value="8">
            <button id="clear">Clear</button>
        </div>
        <div id="editor-container">
            <div id="ascii-chars-container"></div>
            <div id="glyph-container"></div>
        </div>
    </main>
    
    <script src="script.js"></script>
</body>
</html>
